name: BMU Chatbot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test_and_verify:
    name: Run Automated Quality & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python bytecode compilation
        run: |
          echo "Compiling all core Python services..."
          python -m py_compile *.py

      - name: Execute Comprehensive CI/CD Test Suite
        env:
          PYTHONUNBUFFERED: "1"
          RETRIEVAL_ENGINE: "voyage"
        run: |
          echo "Running JEV Guardrails, Topic Coverage, and StateGraph verification..."
          python test_ci_pipeline.py

      - name: Optional Render Deployment Trigger
        if: success() && github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Tests passed! Triggering Render deployment via deploy hook..."
          curl -X POST "$RENDER_DEPLOY_HOOK"

